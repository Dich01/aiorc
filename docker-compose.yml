services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Keep the audit signing key on the persistent volume: a new key on
      # every rebuild would leave older exports unverifiable.
      - AUDIT_KEY_FILE=/app/data/.audit-ed25519.key
    volumes:
      - ./data:/app/data
    expose:
      - "3001"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
