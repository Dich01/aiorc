<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIOrc — Profile</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body.has-sidebar { display:flex; min-height:100vh; background:var(--bg); }
    .sidebar { width:240px; background:#1a1a2e; color:#e0e0ff; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; flex-shrink:0; border-right:1px solid rgba(255,255,255,0.08); transition:width .2s ease; z-index:50; }
    .sidebar-header { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid rgba(255,255,255,0.08); }
    .sidebar-logo { font-size:1.15rem; font-weight:700; }
    .sidebar-logo a { color:inherit; text-decoration:none; }
    .sidebar-logo span { color:var(--primary); }
    .sidebar-collapse-btn { background:none; border:none; color:#9ba3c8; cursor:pointer; font-size:1rem; padding:4px 6px; border-radius:4px; line-height:1; }
    .sidebar-collapse-btn:hover { background:rgba(255,255,255,0.08); color:#fff; }
    .sidebar-section-title { padding:14px 22px 4px; font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:#7a82a8; }
    .sidebar-nav { padding:4px 10px; display:flex; flex-direction:column; gap:2px; }
    .sidebar-item { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:6px; color:#d8dcf2; text-decoration:none; font-size:0.875rem; font-weight:500; cursor:pointer; background:none; border:none; width:100%; text-align:left; font-family:inherit; transition:background .12s, color .12s; }
    .sidebar-item:hover { background:rgba(255,255,255,0.06); color:#fff; }
    .sidebar-item.active { background:rgba(67,97,238,0.22); color:#fff; font-weight:600; }
    .sidebar-item-glyph { width:22px; height:22px; border-radius:5px; background:rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; font-size:0.72rem; font-weight:700; flex-shrink:0; }
    .sidebar-item.active .sidebar-item-glyph { background:rgba(67,97,238,0.45); color:#fff; }
    .sidebar-footer { margin-top:auto; padding:14px 18px; border-top:1px solid rgba(255,255,255,0.08); font-size:0.82rem; display:flex; flex-direction:column; gap:6px; }
    .sidebar-user { color:#d8dcf2; word-break:break-all; opacity:0.85; font-size:0.82rem; }
    .sidebar-logout { color:#9ba3c8; text-decoration:none; font-size:0.82rem; align-self:flex-start; cursor:pointer; }
    .sidebar-logout:hover { color:#fff; }
    .sidebar.collapsed { width:60px; }
    .sidebar.collapsed .sidebar-logo, .sidebar.collapsed .sidebar-section-title, .sidebar.collapsed .sidebar-item-label, .sidebar.collapsed .sidebar-user { display:none; }
    .sidebar.collapsed .sidebar-header { justify-content:center; padding:14px 8px; }
    .sidebar.collapsed .sidebar-item { justify-content:center; padding:9px 8px; }
    .team-badge { margin-left:auto; background:#ef4444; color:#fff; font-size:0.66rem; font-weight:700; padding:1px 6px; border-radius:9px; min-width:16px; text-align:center; line-height:1.4; }
    .sidebar.collapsed .team-badge { position:absolute; top:6px; right:6px; padding:0 4px; min-width:14px; font-size:0.6rem; }
    .sidebar.collapsed #sb-team { position:relative; }

    .anon-nav { background:#1a1a2e; color:#e0e0ff; padding:0 24px; height:60px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 8px rgba(0,0,0,0.3); position:sticky; top:0; z-index:100; }
    .anon-nav .logo { font-size:1.25rem; font-weight:700; color:inherit; text-decoration:none; }
    .anon-nav .logo span { color:var(--primary); }
    .anon-nav-cta { display:flex; gap:10px; align-items:center; }
    .anon-nav-cta a { color:#e0e0ff; text-decoration:none; font-size:0.88rem; }
    .anon-nav-cta a.cta { background:var(--primary); color:#fff; padding:7px 16px; border-radius:6px; font-weight:600; }

    .main-area { flex:1; min-width:0; }
    .main-container { max-width:960px; margin:0 auto; padding:32px 32px 60px; }

    /* Profile header */
    .profile-header { display:flex; gap:24px; align-items:flex-start; margin-bottom:28px; padding-bottom:24px; border-bottom:1px solid var(--border); }
    .profile-avatar-wrap { flex-shrink:0; }
    .profile-avatar-img { width:96px; height:96px; border-radius:50%; object-fit:cover; display:block; border:3px solid var(--border); }
    .profile-avatar-initials { width:96px; height:96px; border-radius:50%; background:linear-gradient(135deg,#4361ee,#7c3aed); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; font-size:2rem; }
    .profile-info { flex:1; min-width:0; }
    .profile-nick { font-size:1.5rem; font-weight:700; color:var(--text); margin-bottom:2px; }
    .profile-name { font-size:0.9rem; color:var(--muted); margin-bottom:10px; }
    .profile-bio { font-size:0.95rem; color:var(--text); line-height:1.6; max-width:640px; white-space:pre-wrap; }
    .profile-bio.empty { font-style:italic; color:var(--muted); }
    .profile-meta-row { display:flex; flex-wrap:wrap; gap:16px; margin-top:12px; font-size:0.82rem; color:var(--muted); }
    .profile-meta-item { display:flex; align-items:center; gap:4px; }
    .profile-edit-btn { margin-top:14px; background:var(--primary); color:#fff; border:none; border-radius:7px; padding:8px 18px; font-size:0.85rem; font-weight:600; cursor:pointer; font-family:inherit; transition:opacity .15s; }
    .profile-edit-btn:hover { opacity:.85; }
    .own-badge { display:inline-block; font-size:0.72rem; background:rgba(67,97,238,0.12); color:var(--primary); border:1px solid rgba(67,97,238,0.3); border-radius:6px; padding:2px 8px; margin-left:8px; vertical-align:middle; font-weight:600; }

    /* Stats */
    .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:28px; }
    .stat-card { background:var(--card-bg); border:1px solid var(--border); border-radius:10px; padding:14px 16px; text-align:center; }
    .stat-val { font-size:1.7rem; font-weight:700; color:var(--primary); line-height:1; margin-bottom:4px; }
    .stat-lbl { font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; }

    /* Edit panel */
    .edit-panel { background:var(--card-bg); border:1px solid var(--border); border-radius:12px; padding:24px; margin-bottom:28px; display:none; }
    .edit-panel.open { display:block; }
    .edit-panel-title { font-size:1rem; font-weight:700; margin:0 0 18px; color:var(--text); }
    .edit-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .edit-field { display:flex; flex-direction:column; gap:5px; }
    .edit-field.full { grid-column:1/-1; }
    .edit-label { font-size:0.8rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; }
    .edit-input { border:1px solid var(--border); border-radius:7px; padding:8px 12px; font-size:0.9rem; font-family:inherit; color:var(--text); background:var(--bg); outline:none; transition:border-color .15s; }
    .edit-input:focus { border-color:var(--primary); }
    textarea.edit-input { resize:vertical; min-height:80px; }
    .char-count { font-size:0.72rem; color:var(--muted); align-self:flex-end; }
    .edit-actions { display:flex; gap:10px; align-items:center; margin-top:18px; flex-wrap:wrap; }
    .btn-save { background:var(--primary); color:#fff; border:none; border-radius:7px; padding:9px 22px; font-weight:600; cursor:pointer; font-family:inherit; font-size:0.9rem; }
    .btn-save:disabled { opacity:.5; cursor:default; }
    .btn-cancel-edit { background:none; border:1px solid var(--border); color:var(--text); border-radius:7px; padding:9px 16px; font-weight:500; cursor:pointer; font-family:inherit; font-size:0.9rem; }
    .edit-msg { font-size:0.85rem; padding:6px 12px; border-radius:6px; display:none; }
    .edit-msg.ok { display:inline-block; background:#d1fae5; color:#065f46; }
    .edit-msg.err { display:inline-block; background:#fee2e2; color:#991b1b; }

    /* Avatar picker */
    .avatar-section-label { font-size:0.8rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; grid-column:1/-1; margin-top:6px; }
    .avatar-picker { display:flex; flex-wrap:wrap; gap:10px; grid-column:1/-1; }
    .avatar-opt { width:60px; height:60px; border-radius:50%; border:3px solid transparent; cursor:pointer; overflow:hidden; transition:border-color .15s, transform .15s; flex-shrink:0; background:var(--bg); }
    .avatar-opt img { width:100%; height:100%; object-fit:cover; display:block; }
    .avatar-opt:hover { transform:scale(1.08); }
    .avatar-opt.selected { border-color:var(--primary); box-shadow:0 0 0 2px rgba(67,97,238,0.35); }
    .avatar-none { width:60px; height:60px; border-radius:50%; border:2px dashed var(--border); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:0.6rem; color:var(--muted); text-align:center; line-height:1.25; background:var(--bg); transition:border-color .15s, color .15s; padding:6px; flex-shrink:0; }
    .avatar-none:hover, .avatar-none.selected { border-color:var(--primary); color:var(--primary); }

    /* Cards */
    .section-title { font-size:1rem; font-weight:700; margin-bottom:14px; color:var(--text); }
    .repo-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:16px; margin-bottom:28px; }
    .repo-card { background:var(--card-bg); border:1px solid var(--border); border-radius:10px; padding:16px 18px; display:flex; flex-direction:column; gap:8px; transition:border-color .15s, transform .15s; }
    .repo-card:hover { border-color:var(--primary); transform:translateY(-2px); }
    .repo-card-name { font-size:0.95rem; font-weight:600; color:var(--text); }
    .repo-card-desc { font-size:0.83rem; color:var(--muted); line-height:1.55; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; min-height:36px; }
    .repo-card-desc.empty { font-style:italic; }
    .repo-stat { display:inline-flex; align-items:center; gap:4px; font-size:0.8rem; color:var(--muted); }
    .repo-stat.gold { color:#b45309; font-weight:600; }
    .repo-stats-row { display:flex; gap:10px; }
    .pub-badge { display:inline-flex; align-items:center; gap:4px; font-size:0.7rem; padding:2px 8px; border-radius:10px; font-weight:600; background:#d1fae5; color:#065f46; }
    .card-footer { display:flex; gap:8px; margin-top:auto; padding-top:8px; border-top:1px solid var(--border); }

    .empty-state { text-align:center; padding:40px 20px; color:var(--muted); border:1px dashed var(--border); border-radius:10px; margin-bottom:24px; }
    .toast { position:fixed; bottom:20px; right:20px; background:#1a1a2e; color:#fff; padding:8px 16px; border-radius:6px; font-size:0.85rem; z-index:9999; }

    @media (max-width:768px) {
      body.has-sidebar { flex-direction:column; }
      .sidebar { width:100% !important; height:auto; position:static; }
      .main-container { padding:20px 16px; }
      .profile-header { flex-direction:column; align-items:center; text-align:center; }
      .stats-grid { grid-template-columns:repeat(2,1fr); }
      .edit-grid { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

<div id="shell-mount"></div>

<main class="main-area">
  <div class="main-container">
    <div id="profile-content"><p style="color:var(--muted)">Loading profile&hellip;</p></div>
  </div>
</main>

<script src="info-modal.js"></script>
<script>
(function () {
  'use strict';

  var token      = localStorage.getItem('token') || '';
  var isLoggedIn = !!token;
  var myNick     = localStorage.getItem('userNickname') || '';
  var myEmail    = localStorage.getItem('userEmail') || '';
  var params     = new URLSearchParams(location.search);
  var targetNick = (params.get('nick') || '').trim();

  var AVATARS = [
    'avatar01.png','avatar02.png','avatar03.png',
    'avatar04.png','avatar05.png','Avatar06.png','Avatar07.png'
  ];

  /* ── helpers ── */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function initials(n) {
    return String(n || '').split(/[\s@_-]+/).filter(Boolean)
      .map(function(p){ return p[0]; }).join('').toUpperCase().slice(0,2) || '?';
  }
  function fmtDate(ts) {
    if (!ts) return 'never';
    try { return new Date(ts).toLocaleDateString('en',{year:'numeric',month:'long',day:'numeric'}); }
    catch(e) { return ''; }
  }
  function toast(msg) {
    document.querySelectorAll('.toast').forEach(function(x){ x.remove(); });
    var el = document.createElement('div');
    el.className = 'toast'; el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function(){ el.remove(); }, 2200);
  }
  function apiFetch(url, opts) {
    opts = opts || {};
    var headers = Object.assign({'Content-Type':'application/json'}, opts.headers || {});
    if (token) headers['Authorization'] = 'Bearer ' + token;
    return fetch(url, Object.assign({}, opts, {headers: headers}));
  }

  /* ── sidebar shell ── */
  var mount = document.getElementById('shell-mount');
  if (isLoggedIn) {
    document.body.classList.add('has-sidebar');
    mount.outerHTML = '<aside class="sidebar" id="sidebar">' +
      '<div class="sidebar-header">' +
        '<div class="sidebar-logo"><a href="dashboard.html">AI<span>Orc</span></a></div>' +
        '<button class="sidebar-collapse-btn" id="sidebar-toggle" onclick="toggleSidebar()">&#8249;</button>' +
      '</div>' +
      '<div class="sidebar-section-title">Workspace</div>' +
      '<nav class="sidebar-nav">' +
        '<a class="sidebar-item" href="dashboard.html?tab=projects"><span class="sidebar-item-glyph">P</span><span class="sidebar-item-label">Projects</span></a>' +
        '<a class="sidebar-item" href="dashboard.html?tab=agents"><span class="sidebar-item-glyph">A</span><span class="sidebar-item-label">Agents</span></a>' +
        '<a class="sidebar-item" href="dashboard.html?tab=skills"><span class="sidebar-item-glyph">S</span><span class="sidebar-item-label">Skills</span></a>' +
        '<a class="sidebar-item" href="dashboard.html?tab=contexts"><span class="sidebar-item-glyph">C</span><span class="sidebar-item-label">Contexts</span></a>' +
        '<a class="sidebar-item" id="sb-team" href="dashboard.html?tab=team"><span class="sidebar-item-glyph">E</span><span class="sidebar-item-label">Team</span><span id="team-badge" class="team-badge" style="display:none">0</span></a>' +
      '</nav>' +
      '<div class="sidebar-section-title">Insights</div>' +
      '<nav class="sidebar-nav">' +
        '<a class="sidebar-item" href="analytics.html"><span class="sidebar-item-glyph">U</span><span class="sidebar-item-label">Usage analytics</span></a>' +
      '</nav>' +
      '<div class="sidebar-section-title">Community</div>' +
      '<nav class="sidebar-nav">' +
        '<a class="sidebar-item" href="repository.html"><span class="sidebar-item-glyph">R</span><span class="sidebar-item-label">Public repository</span></a>' +
        '<a class="sidebar-item" href="issues.html"><span class="sidebar-item-glyph">I</span><span class="sidebar-item-label">Issues</span></a>' +
      '</nav>' +
      '<div class="sidebar-section-title">Help</div>' +
      '<nav class="sidebar-nav">' +
        '<button class="sidebar-item" onclick="openInfoModal()"><span class="sidebar-item-glyph">?</span><span class="sidebar-item-label">How to use AIOrc</span></button>' +
        '<a class="sidebar-item" href="faq.html"><span class="sidebar-item-glyph">D</span><span class="sidebar-item-label">Documentation</span></a>' +
      '</nav>' +
      '<div class="sidebar-footer">' +
        '<a href="' + (myNick ? 'user.html?nick=' + encodeURIComponent(myNick) : '#') + '" class="sidebar-user" style="font-weight:600;text-decoration:none;color:inherit">' +
          (myNick ? '@' + esc(myNick) : esc(myEmail)) +
        '</a>' +
        '<div class="sidebar-user" style="font-size:0.74rem;opacity:0.6">' + esc(myEmail) + '</div>' +
        '<a href="#" class="sidebar-logout" id="logout-btn">Log out</a>' +
      '</div>' +
    '</aside>';

    var SK = 'aiorc.sidebar.collapsed';
    window.toggleSidebar = function() {
      var c = localStorage.getItem(SK) === '1';
      localStorage.setItem(SK, c ? '0' : '1');
      applySidebar();
    };
    function applySidebar() {
      var c = localStorage.getItem(SK) === '1';
      var sb = document.getElementById('sidebar');
      var btn = document.getElementById('sidebar-toggle');
      if (sb) sb.classList.toggle('collapsed', c);
      if (btn) btn.textContent = c ? '›' : '‹';
    }
    applySidebar();

    document.getElementById('logout-btn').addEventListener('click', function(e) {
      e.preventDefault(); localStorage.clear(); location.href = 'index.html';
    });

    apiFetch('/invitations/incoming').then(function(r){ return r.ok ? r.json() : []; })
      .then(function(list) {
        var n = list.filter(function(i){ return i.status === 'pending'; }).length;
        var b = document.getElementById('team-badge');
        if (b && n > 0) { b.textContent = n; b.style.display = ''; }
      }).catch(function(){});

  } else {
    mount.outerHTML =
      '<nav class="anon-nav">' +
        '<a href="/" class="logo">AI<span>Orc</span></a>' +
        '<div class="anon-nav-cta">' +
          '<a href="repository.html">Public repository</a>' +
          '<a href="faq.html">Documentation</a>' +
          '<a href="index.html">Log in</a>' +
          '<a href="index.html" class="cta">Create account</a>' +
        '</div>' +
      '</nav>';
  }

  /* ── avatar HTML builder ── */
  function avatarEl(avatar, nick) {
    var size = '96px';
    if (avatar) {
      return '<img class="profile-avatar-img" src="iconos/' + esc(avatar) + '" ' +
             'alt="avatar" style="width:' + size + ';height:' + size + '" ' +
             'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">' +
             '<div class="profile-avatar-initials" style="width:' + size + ';height:' + size + ';display:none">' +
               esc(initials(nick)) +
             '</div>';
    }
    return '<div class="profile-avatar-initials" style="width:' + size + ';height:' + size + '">' +
           esc(initials(nick)) + '</div>';
  }

  /* ── stat card ── */
  function statCard(val, label) {
    return '<div class="stat-card"><div class="stat-val">' + val +
           '</div><div class="stat-lbl">' + esc(label) + '</div></div>';
  }

  /* ── card renderers ── */
  function projectCard(p, canOpen) {
    var desc = (p.description || '').trim();
    var href = canOpen ? ('project.html?id=' + encodeURIComponent(p.id)) : '#';
    var nameEl = canOpen
      ? '<a href="' + href + '" style="text-decoration:none;color:inherit"><span class="repo-card-name">' + esc(p.name) + '</span></a>'
      : '<span class="repo-card-name">' + esc(p.name) + '</span>';
    return '<div class="repo-card">' +
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' + nameEl + '<span class="pub-badge">&#x25CF; Public</span></div>' +
      '<div class="repo-card-desc' + (desc ? '' : ' empty') + '">' + esc(desc || 'No description.') + '</div>' +
      '<div class="repo-stats-row">' +
        '<span class="repo-stat' + ((p.stars_count || 0) > 0 ? ' gold' : '') + '" title="Stars">&#9733; ' + (p.stars_count || 0) + '</span>' +
        '<span class="repo-stat" title="Forks">&#x1F374; ' + (p.forks_count || 0) + '</span>' +
        '<span class="repo-stat" title="Agents">&#9881; ' + (p.agents_count || 0) + '</span>' +
      '</div>' +
      '<div class="card-footer"><a href="repository.html" style="font-size:0.8rem;color:var(--primary);text-decoration:none">View in repository &#8594;</a></div>' +
    '</div>';
  }

  function agentCard(a) {
    var desc = (a.description || '').trim();
    var skills = (a.skills || []).length;
    return '<div class="repo-card">' +
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="repo-card-name">' + esc(a.name) + '</span><span class="pub-badge">&#x25CF; Public</span></div>' +
      '<div class="repo-card-desc' + (desc ? '' : ' empty') + '">' + esc(desc || 'No description.') + '</div>' +
      '<div class="repo-stats-row">' +
        '<span class="repo-stat' + ((a.stars_count || 0) > 0 ? ' gold' : '') + '" title="Stars">&#9733; ' + (a.stars_count || 0) + '</span>' +
        '<span class="repo-stat" title="Forks">&#x1F374; ' + (a.forks_count || 0) + '</span>' +
        '<span class="repo-stat" title="Skills">&#9881; ' + skills + '</span>' +
      '</div>' +
      '<div class="card-footer"><a href="repository.html" style="font-size:0.8rem;color:var(--primary);text-decoration:none">View in repository &#8594;</a></div>' +
    '</div>';
  }

  function skillCard(s) {
    var desc = (s.description || '').trim();
    return '<div class="repo-card">' +
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="repo-card-name">' + esc(s.name) + '</span><span class="pub-badge">&#x25CF; Public</span></div>' +
      '<div class="repo-card-desc' + (desc ? '' : ' empty') + '">' + esc(desc || 'No description.') + '</div>' +
      '<div class="repo-stats-row">' +
        '<span class="repo-stat' + ((s.stars_count || 0) > 0 ? ' gold' : '') + '" title="Stars">&#9733; ' + (s.stars_count || 0) + '</span>' +
        '<span class="repo-stat" title="Forks">&#x1F374; ' + (s.forks_count || 0) + '</span>' +
      '</div>' +
      '<div class="card-footer"><a href="repository.html" style="font-size:0.8rem;color:var(--primary);text-decoration:none">View in repository &#8594;</a></div>' +
    '</div>';
  }

  /* ── edit panel (own profile only) ── */
  var selectedAvatar = '';

  function buildEditPanel(user) {
    selectedAvatar = user.avatar || '';

    var noneClass = selectedAvatar === '' ? 'avatar-none selected' : 'avatar-none';
    var optionsHtml = '<div class="' + noneClass + '" id="av-none" onclick="pickAvatar(\'\')">No avatar</div>';
    AVATARS.forEach(function(f) {
      var sel = selectedAvatar === f ? ' selected' : '';
      optionsHtml += '<div class="avatar-opt' + sel + '" id="av-' + f + '" onclick="pickAvatar(\'' + f + '\')">' +
        '<img src="iconos/' + esc(f) + '" alt="' + esc(f) + '">' +
      '</div>';
    });

    return '<div class="edit-panel" id="edit-panel">' +
      '<p class="edit-panel-title">Edit my profile</p>' +
      '<div class="edit-grid">' +
        '<div class="edit-field">' +
          '<label class="edit-label">Name</label>' +
          '<input id="ep-name" class="edit-input" type="text" maxlength="80" value="' + esc(user.name || '') + '">' +
        '</div>' +
        '<div class="edit-field">' +
          '<label class="edit-label">Nickname</label>' +
          '<input id="ep-nick" class="edit-input" type="text" maxlength="30" value="' + esc(user.nickname || '') + '">' +
        '</div>' +
        '<div class="edit-field full">' +
          '<label class="edit-label">Bio</label>' +
          '<textarea id="ep-bio" class="edit-input" maxlength="500" oninput="updateBioCount()">' + esc(user.bio || '') + '</textarea>' +
          '<span class="char-count" id="bio-count">' + (user.bio || '').length + '/500</span>' +
        '</div>' +
        '<div class="avatar-section-label">Avatar</div>' +
        '<div class="avatar-picker">' + optionsHtml + '</div>' +
      '</div>' +
      '<div class="edit-actions">' +
        '<button class="btn-save" id="ep-save" onclick="saveProfile()">Save changes</button>' +
        '<button class="btn-cancel-edit" onclick="toggleEdit(false)">Cancel</button>' +
        '<span class="edit-msg" id="ep-msg"></span>' +
      '</div>' +
    '</div>';
  }

  window.pickAvatar = function(filename) {
    selectedAvatar = filename;
    document.querySelectorAll('.avatar-opt').forEach(function(el) {
      el.classList.toggle('selected', el.id === 'av-' + filename);
    });
    var noneEl = document.getElementById('av-none');
    if (noneEl) noneEl.classList.toggle('selected', filename === '');
  };

  window.updateBioCount = function() {
    var ta = document.getElementById('ep-bio');
    var cnt = document.getElementById('bio-count');
    if (ta && cnt) cnt.textContent = ta.value.length + '/500';
  };

  window.toggleEdit = function(open) {
    var panel = document.getElementById('edit-panel');
    if (panel) panel.classList.toggle('open', open);
    if (open) {
      setTimeout(function() {
        var ep = document.getElementById('ep-name');
        if (ep) ep.focus();
      }, 50);
    }
  };

  window.saveProfile = function() {
    var btn  = document.getElementById('ep-save');
    var msg  = document.getElementById('ep-msg');
    var name = (document.getElementById('ep-name') || {}).value;
    var nick = (document.getElementById('ep-nick') || {}).value;
    var bio  = (document.getElementById('ep-bio')  || {}).value;
    if (!btn || !msg) return;

    btn.disabled = true;
    msg.className = 'edit-msg';

    var body = { avatar: selectedAvatar };
    if (typeof name === 'string' && name.trim()) body.name = name.trim();
    if (typeof nick === 'string' && nick.trim()) body.nickname = nick.trim();
    if (typeof bio  === 'string') body.bio = bio;

    apiFetch('/users/me', { method: 'PATCH', body: JSON.stringify(body) })
      .then(function(r) { return r.json().then(function(d) { return {ok: r.ok, data: d}; }); })
      .then(function(res) {
        if (!res.ok) throw new Error(res.data.error || 'Error saving');
        if (res.data.nickname) localStorage.setItem('userNickname', res.data.nickname);
        msg.textContent = 'Changes saved';
        msg.className = 'edit-msg ok';
        setTimeout(function() {
          location.href = 'user.html?nick=' + encodeURIComponent(res.data.nickname);
        }, 800);
      })
      .catch(function(err) {
        msg.textContent = err.message;
        msg.className = 'edit-msg err';
        btn.disabled = false;
      });
  };

  /* ── main: load profile ── */
  function loadProfile() {
    var host = document.getElementById('profile-content');

    if (!targetNick) {
      if (isLoggedIn && myNick) {
        location.replace('user.html?nick=' + encodeURIComponent(myNick));
        return;
      }
      host.innerHTML = '<div class="empty-state"><h3>Missing nickname</h3>' +
        '<p>This page expects a <code>?nick=user</code> parameter in the URL.</p></div>';
      return;
    }

    apiFetch('/users/by-nickname/' + encodeURIComponent(targetNick))
      .then(function(r) {
        if (r.status === 404) {
          host.innerHTML = '<div class="empty-state"><h3>User not found</h3>' +
            '<p>No user exists with the nickname <strong>@' + esc(targetNick) + '</strong>.</p></div>';
          return Promise.reject('not_found');
        }
        if (!r.ok) return Promise.reject(new Error('Could not load profile'));
        return r.json();
      })
      .then(function(user) {
        var st   = user.stats || {};
        var isMe = isLoggedIn && myNick &&
                   user.nickname.toLowerCase() === myNick.toLowerCase();

        return Promise.all([
          apiFetch('/projects/public?owner=' + encodeURIComponent(user.nickname)),
          apiFetch('/agents/public?owner='   + encodeURIComponent(user.nickname)),
          apiFetch('/skills/public?owner='   + encodeURIComponent(user.nickname))
        ]).then(function(rs) {
          return Promise.all(rs.map(function(r) { return r.ok ? r.json() : []; }));
        }).then(function(cols) {
          var projects = cols[0];
          var agents   = cols[1];
          var skills   = cols[2];

          var bio = (user.bio || '').trim();

          /* ── profile header ── */
          var headerHtml =
            '<div class="profile-header">' +
              '<div class="profile-avatar-wrap">' + avatarEl(user.avatar, user.nickname) + '</div>' +
              '<div class="profile-info">' +
                '<div class="profile-nick">@' + esc(user.nickname) +
                  (isMe ? '<span class="own-badge">your profile</span>' : '') +
                '</div>' +
                (user.name && user.name !== user.nickname
                  ? '<div class="profile-name">' + esc(user.name) + '</div>' : '') +
                '<div class="profile-bio' + (bio ? '' : ' empty') + '">' +
                  (bio ? esc(bio) : 'This user has not written a bio yet.') +
                '</div>' +
                '<div class="profile-meta-row">' +
                  '<span class="profile-meta-item">Member since ' + fmtDate(user.created_at) + '</span>' +
                  '<span class="profile-meta-item">&#183; Last activity ' + fmtDate(user.last_login) + '</span>' +
                  '<span class="profile-meta-item">&#183; &#9733; ' + (st.stars_received || 0) + ' received</span>' +
                  '<span class="profile-meta-item">&#183; &#x1F374; ' + (st.forks_received || 0) + ' received</span>' +
                '</div>' +
                (isMe ? '<button class="profile-edit-btn" onclick="toggleEdit(true)">&#9998; Edit profile</button>' : '') +
              '</div>' +
            '</div>';

          /* ── edit panel (only own profile) ── */
          var editHtml = isMe ? buildEditPanel(user) : '';

          /* ── stats grid ── */
          var statsHtml =
            '<div class="stats-grid">' +
              statCard(st.projects      || 0, 'Projects') +
              statCard(st.agents        || 0, 'Agents') +
              statCard(st.skills        || 0, 'Skills') +
              statCard(st.forks_made    || 0, 'Forks made') +
              statCard(st.issues_created|| 0, 'Issues created') +
              statCard(st.issue_comments|| 0, 'Comments') +
              statCard(st.stars_received|| 0, 'Stars received') +
              statCard(st.forks_received|| 0, 'Forks received') +
            '</div>';

          /* ── public content ── */
          var projHtml = '<div class="section-title">Public projects (' + projects.length + ')</div>' +
            (projects.length === 0
              ? '<div class="empty-state"><p>' + (isMe ? 'You don\'t have any public projects yet.' : 'This user has not published any projects yet.') + '</p></div>'
              : '<div class="repo-grid">' + projects.map(function(p){ return projectCard(p, isLoggedIn); }).join('') + '</div>');

          var agentHtml = '<div class="section-title">Public agents (' + agents.length + ')</div>' +
            (agents.length === 0
              ? '<div class="empty-state"><p>' + (isMe ? 'You don\'t have any public agents yet.' : 'This user has not published any agents yet.') + '</p></div>'
              : '<div class="repo-grid">' + agents.map(agentCard).join('') + '</div>');

          var skillHtml = '<div class="section-title">Public skills (' + skills.length + ')</div>' +
            (skills.length === 0
              ? '<div class="empty-state"><p>' + (isMe ? 'You don\'t have any public skills yet.' : 'This user has not published any skills yet.') + '</p></div>'
              : '<div class="repo-grid">' + skills.map(skillCard).join('') + '</div>');

          host.innerHTML = headerHtml + editHtml + statsHtml + projHtml + agentHtml + skillHtml;
        });
      })
      .catch(function(err) {
        if (err === 'not_found') return;
        host.innerHTML = '<div class="empty-state"><h3>Error</h3><p>' + esc(err.message || String(err)) + '</p></div>';
      });
  }

  loadProfile();

}());
</script>
</body>
</html>
